name: wordnest
description: "WordNest 🌳 — বাংলা শব্দ খোঁজ গেম | A Bangla word search puzzle game for kids & families"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.1.0

  # Unicode / Bangla support
  characters: ^1.3.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/mascot/
    - assets/images/map/
    - assets/images/icons/
    - assets/images/patterns/
    - assets/animations/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/data/levels/
